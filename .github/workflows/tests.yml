name: Tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core:
    name: Core (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zlib, gd, openssl, intl
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: pip install "pymupdf==1.27.1"
      - name: Test suites
        run: bash .github/scripts/run-tests.sh
      - name: Examples
        run: php examples/generate.php

  minimal-extensions:
    name: Without gd/intl (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.5']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zlib, openssl, :gd, :intl
          coverage: none
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install PyMuPDF
        run: pip install "pymupdf==1.27.1"
      - name: Verify gd and intl are absent
        run: |
          php -r 'exit(extension_loaded("gd") || extension_loaded("intl") ? 1 : 0);'
      - name: Test suites (those that build GD fixtures are skipped)
        run: bash .github/scripts/run-tests.sh --skip-gd
      - name: Examples
        run: php examples/generate.php

  laravel:
    name: Laravel package (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zlib, gd, openssl, intl
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: integrations/laravel
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        working-directory: integrations/laravel
        run: vendor/bin/phpunit

  symfony:
    name: Symfony bundle (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.2', '8.4']
    steps:
      - uses: actions/checkout@v5
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, mbstring, zlib, gd, openssl, intl
          coverage: none
          tools: composer:v2
      - name: Install
        working-directory: integrations/symfony
        run: composer update --no-interaction --no-progress --prefer-dist
      - name: PHPUnit
        working-directory: integrations/symfony
        run: vendor/bin/phpunit
